# The controller itself comes from the devicetree: CONFIG_MSPI_N32 is default y
# once the overlay enables the qspi node, and the flash node under it is what
# gives the sample its device index. Nothing here has to name either of them.
CONFIG_MSPI=y

CONFIG_PRINTK=y

# Minimal mode routes LOG_* straight to printk instead of buffering them for a
# log thread, which keeps the driver's errors in order with the sample's own
# output. That ordering is the whole point of the log here: a failed step
# should be followed immediately by the check that reports on it.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# The driver only logs failures, and the sample's own level is set where the
# module is registered.
CONFIG_MSPI_LOG_LEVEL_WRN=y

# The sample holds four 16 byte buffers and a 256 byte page on the stack, plus
# the packet and transfer structures it hands to the API.
CONFIG_MAIN_STACK_SIZE=2048
