# I2C + EEPROM subsystem. CONFIG_EEPROM_AT24 is selected automatically
# because the board devicetree declares an "atmel,at24" node on i2c1.
CONFIG_I2C=y
CONFIG_EEPROM=y

# Let the driver clock a stuck bus free instead of timing out on every
# transfer until the board is reset. Needs scl-gpios/sda-gpios in devicetree;
# the board file supplies them for i2c1.
CONFIG_I2C_BUS_RECOVERY=y

CONFIG_PRINTK=y

# The I2C driver reports through the logging API, but its messages are
# warnings about bus-level trouble (e.g. the driver having to clock a stuck
# bus free), not part of the PASS/FAIL report. Turn logging on or those
# messages are compiled out and the driver fails silently.
#
# Minimal mode routes LOG_* through printk instead of buffering them for a
# log thread, so this costs no extra thread or ring buffer and the driver's
# lines stay in order with the sample's own output on the console.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_I2C_LOG_LEVEL_WRN=y

# The sample keeps its whole-chip pattern/readback buffers as static data,
# so the default main stack is enough. Raise it if you add larger buffers.
CONFIG_MAIN_STACK_SIZE=2048
