# The sample only needs the I2S API and a console to report on. The I2S
# instances themselves, and the DMA channels under them, come from the
# devicetree, so nothing here has to name them.
CONFIG_I2S=y

CONFIG_PRINTK=y

# The driver logs nothing above LOG_DBG while a stream is running, on purpose:
# in a minimal-mode build LOG_ERR goes straight to printk and a console write
# can outlast the block it is racing. Minimal mode is still the right choice
# here because it routes LOG_* through printk instead of buffering them for a
# log thread, so the driver's init-time errors stay in order with the sample's
# own output.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_I2S_LOG_LEVEL_WRN=y

# The sine table and the two blocks are static, so the default stack is
# enough; this is headroom for anything added on top.
CONFIG_MAIN_STACK_SIZE=2048
