description: Nations Technologies N32 general-purpose/advanced timer

compatible: "nsing,n32-tim"

include: [base.yaml]

properties:
  reg:
    required: true
  clocks:
    required: true
  interrupts:
    required: true
  prescaler:
    type: int
    default: 0
    description: Timer clock prescaler value (actual division is prescaler + 1).
  channels:
    type: int
    required: true
    description: Number of capture/compare channels implemented by the timer.
  advanced:
    type: boolean
    description: Timer has the advanced-control main output enable bit.
