description: Nations Technologies N32G45x USB FS device controller

compatible: "nsing,n32-usb"

include: [usb-ep.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  ram-size:
    type: int
    required: true
    description: |
      Size of USB dedicated packet memory area (PMA), in bytes.

  clocks:
    required: true
