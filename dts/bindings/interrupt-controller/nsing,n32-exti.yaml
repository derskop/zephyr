description: Nations Technologies N32 external interrupt controller

compatible: "nsing,n32-exti"

include: base.yaml

properties:
  reg:
    required: true
  interrupts:
    required: true
  interrupt-controller:
    type: boolean
    required: true
  "#interrupt-cells":
    type: int
    required: true
    const: 1
  num-lines:
    type: int
    default: 16
    description: |
      Total number of EXTI lines dedicated to GPIO interrupts.
  line-ranges:
    type: array
    required: true
    description: |
      Description of the input lines range for each interrupt line supported
      by the external interrupt controller. For each line a couple of
      integers is provided: the number of the first line of the range start
      and the length of the range.
      As example:
            line-ranges = <0 1>, <1 1>, <2 1>, <3 1>,
                          <4 1>, <5 5>, <10 6>;
