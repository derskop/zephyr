description: Nations Technologies N32 Reset and Clock Control (RCC)

compatible: "nsing,n32-rcc"

include: [base.yaml, clock-controller.yaml]

properties:
  reg:
    required: true

  "#clock-cells":
    const: 1

  clock-frequency:
    type: int
    required: true
    description: |
      SYSCLK in Hz, as the vendor SystemInit() programs it. Unlike the bus
      clocks, which the driver derives from RCC by reading the prescaler
      fields back, SYSCLK cannot be recovered from a register, so it is
      declared here. It is also the source of SYS_CLOCK_HW_CYCLES_PER_SEC
      and of the I2S frame clock prescaler.

clock-cells:
  - bits
