description: Nations Technologies N32 Reset and Clock Control (RCC)

compatible: "nsing,n32-rcc"

include: [base.yaml, clock-controller.yaml]

properties:
  reg:
    required: true

  "#clock-cells":
    const: 1

  clock-frequency:
    type: int
    description: |
      default frequency in Hz for clock output

  ahb-prescaler:
    type: int
    enum: [1, 2, 4, 8, 16, 64, 128, 256, 512]
    description: AHB prescaler.

  apb1-prescaler:
    type: int
    enum: [1, 2, 4, 8, 16]
    description: APB1 prescaler.

  apb2-prescaler:
    type: int
    enum: [1, 2, 4, 8, 16]
    description: APB2 prescaler.

clock-cells:
  - bits
