description: Nsing Technologies N32 I2C controller

compatible: "nsing,n32-i2c"

include: [i2c-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  interrupts:
    required: true

  scl-gpios:
    type: phandle-array
    description: |
      GPIO the I2C SCL signal is routed to. Only needed for bus recovery,
      which drives SCL by hand to clock a slave that is holding SDA low
      back to idle. Without it the driver cannot recover a stuck bus.

  sda-gpios:
    type: phandle-array
    description: |
      GPIO the I2C SDA signal is routed to. Only needed for bus recovery,
      see scl-gpios.
