# The N32 I2S block has no internal loopback, so the test relies on the two
# instances being cabled together; see the .overlay next to this file.
# I2S_OPT_LOOPBACK is ignored by the driver either way.
CONFIG_I2S_TEST_USE_GPIO_LOOPBACK=y

# An I2S instance is half duplex: I2SCFG.MODCFG selects exactly one of
# slave-TX, slave-RX, master-TX and master-RX, so the suite runs against two
# devices and I2S_DIR_BOTH is answered with -ENOSYS. That is what makes the
# i2s_dir_both suites skip themselves. Do not also set
# I2S_TEST_USE_I2S_DIR_BOTH: it would turn those skips into failures.
CONFIG_I2S_TEST_SEPARATE_DEVICES=y

# The target is armed at an arbitrary point within a frame, so the first word
# it captures can be a couple of stereo pairs into the stream. Leaving
# I2S_TEST_ALLOW_VARIABLE_OFFSET off means the offset is measured once and then
# required to stay put, which is what a cabled controller/target pair does.
CONFIG_I2S_TEST_ALLOWED_DATA_OFFSET=2
